[project]
name = "ltx-pipelines"
version = "1.3.0"
description = "Pipelines implementation for Lightricks' LTX-2 model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ltx-core",
    "av",
    "tqdm",
    "pillow",
    "openimageio",
    "cloudpickle>=3.1",
    "kornia==0.8.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
