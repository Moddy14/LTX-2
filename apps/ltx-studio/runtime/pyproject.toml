[project]
name = "ltx-studio-native-runtime"
version = "0.1.0"
description = "Locked native LTX renderer runtime for LTX Studio"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.13.0",
    "av==16.1.0",
    "kornia==0.8.2",
    "ltx-core",
    "ltx-pipelines",
    "opencv-python-headless==4.13.0.92",
    "openai-whisper==20250625",
    "openimageio==3.1.15.0",
    "requests==2.34.2",
    "setuptools==84.0.0",
    "torch @ https://download-r2.pytorch.org/whl/cu132/torch-2.13.0%2Bcu132-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=184f88e91546a2087aee2e5e71012ea6182aaf9d6bc81c28375be2816c349a49",
    "torchaudio @ https://download-r2.pytorch.org/whl/test/cu132/torchaudio-2.11.0%2Bcu132-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=06dcecc6ccd6746fc9f497c0587f67cb5c79cbc7160034e82c97353583cf9d3d",
    "transformers==5.14.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
no-sources-package = ["torch", "torchaudio"]

[tool.uv.workspace]
members = []

[tool.uv.sources]
ltx-core = { path = "../../../packages/ltx-core", editable = true }
ltx-pipelines = { path = "../../../packages/ltx-pipelines", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
